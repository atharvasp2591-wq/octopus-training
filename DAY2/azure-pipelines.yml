trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

variables:
  PYTHON_VERSION: '3.12'
  PIP_CACHE_DIR: '$(Pipeline.Workspace)/.pip'
  PACKAGE_ARTIFACT_NAME: 'python-package'
  AZURE_ARTIFACTS_FEED: 'atharvasp2591'
  AZURE_ARTIFACTS_USERNAME: 'atharva'

stages:
- stage: Build
  displayName: Build and publish Python package
  jobs:
  - job: PackageBuild
    displayName: Package build and artifact publish
    pool:
      vmImage: ubuntu-latest
    timeoutInMinutes: 30

    steps:
    - checkout: self
      fetchDepth: 0

    - task: UsePythonVersion@0
      displayName: Use Python $(PYTHON_VERSION)
      inputs:
        versionSpec: '$(PYTHON_VERSION)'
        addToPath: true
        architecture: 'x64'

    - script: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -r requirements-dev.txt
        python -m pre_commit install
      displayName: Install Python dependencies and git hooks
      workingDirectory: '$(Build.SourcesDirectory)/DAY2'

    - script: |
        python -m pre_commit run --all-files
      displayName: Run pre-commit quality checks
      workingDirectory: '$(Build.SourcesDirectory)/DAY2'
      env:
        PYTHONPATH: '$(Build.SourcesDirectory)/DAY2/src'

    - script: |
        python -m pytest -q
      displayName: Run unit tests
      workingDirectory: '$(Build.SourcesDirectory)/DAY2'
      env:
        PYTHONPATH: '$(Build.SourcesDirectory)/DAY2/src'

    - script: |
        python -m build
        python -m twine check dist/*
      displayName: Build package and validate distribution
      workingDirectory: '$(Build.SourcesDirectory)/DAY2'

    - task: TwineAuthenticate@1
      displayName: Configure twine for Azure Artifacts feed
      inputs:
        artifactFeed: 'atharvasp2591'
        project: 'octopus-deployment'

    - script: |
        python -m twine upload --config-file $(PYPIRC_PATH) --repository atharvasp2591 dist/*
      displayName: Publish package to Azure Artifacts
      workingDirectory: '$(Build.SourcesDirectory)/DAY2'

    - task: PublishPipelineArtifact@1
      displayName: Publish package artifact
      inputs:
        targetPath: '$(Build.SourcesDirectory)/DAY2/dist'
        artifact: '$(PACKAGE_ARTIFACT_NAME)'
        publishLocation: 'pipeline'
