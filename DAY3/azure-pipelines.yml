trigger:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - DAY3/*

pr:
  branches:
    include:
      - main
      - master
  paths:
    include:
      - DAY3/*

variables:
  DOTNET_VERSION: '8.x'
  DACPAC_SOURCE_PATH: '$(Pipeline.Workspace)/drop'
  SQL_PACKAGE_VERSION: '162.2.111.2'
  ENVIRONMENT_NAME: 'Development'
  DevSqlServer: '48.216.208.214,1433'
  ProdSqlServer: '48.216.208.214,1433'
  ProdSqlDatabase: 'test'
  ProdSqlUsername: 'abhi'

stages:
- stage: Package
  displayName: Build DACPAC Package
  jobs:
  - job: BuildDacpac
    displayName: Build SQL Database Project
    pool:
      vmImage: windows-2025
    timeoutInMinutes: 30

    steps:
    - checkout: self
      fetchDepth: 0

    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        version: $(DOTNET_VERSION)
        packageType: 'sdk'

    - script: |
        dotnet tool install -g Microsoft.SqlPackage
      displayName: Install SqlPackage CLI tool

    - script: |
        @echo off
        if not exist "$(Build.SourcesDirectory)\DAY3\Database" (
          echo Database project folder not found. Creating sample structure...
          mkdir "$(Build.SourcesDirectory)\DAY3\Database"
        )
      displayName: Verify database project structure
      continueOnError: true

    - script: |
        @echo off
        setlocal enabledelayedexpansion
        
        set SQL_DIR=$(Build.SourcesDirectory)\DAY3\Database
        
        REM Check if SQL files exist, if not, create sample ones
        if not exist "!SQL_DIR!\dbo\Tables" (
          echo Creating SQL file structure...
          mkdir "!SQL_DIR!\dbo\Tables"
          mkdir "!SQL_DIR!\dbo\StoredProcedures"
        )
        
        REM Create Users table if it doesn't exist
        if not exist "!SQL_DIR!\dbo\Tables\Users.sql" (
          (
            echo CREATE TABLE [dbo].[Users] ^(
            echo     [UserId] INT IDENTITY^(1,1^) PRIMARY KEY,
            echo     [Username] NVARCHAR^(100^) NOT NULL UNIQUE,
            echo     [Email] NVARCHAR^(255^) NOT NULL UNIQUE,
            echo     [FirstName] NVARCHAR^(100^),
            echo     [LastName] NVARCHAR^(100^),
            echo     [CreatedAt] DATETIME2 DEFAULT GETUTCDATE^(^),
            echo     [UpdatedAt] DATETIME2 DEFAULT GETUTCDATE^(^),
            echo     [IsActive] BIT DEFAULT 1
            echo ^);
          ) > "!SQL_DIR!\dbo\Tables\Users.sql"
          echo Created: !SQL_DIR!\dbo\Tables\Users.sql
        )
        
        REM Create stored procedure if it doesn't exist
        if not exist "!SQL_DIR!\dbo\StoredProcedures\sp_GetUserById.sql" (
          (
            echo CREATE PROCEDURE [dbo].[sp_GetUserById]
            echo     @UserId INT
            echo AS
            echo BEGIN
            echo     SET NOCOUNT ON;
            echo     
            echo     SELECT 
            echo         UserId,
            echo         Username,
            echo         Email,
            echo         FirstName,
            echo         LastName,
            echo         CreatedAt,
            echo         IsActive
            echo     FROM [dbo].[Users]
            echo     WHERE UserId = @UserId;
            echo END;
          ) > "!SQL_DIR!\dbo\StoredProcedures\sp_GetUserById.sql"
          echo Created: !SQL_DIR!\dbo\StoredProcedures\sp_GetUserById.sql
        )
        
        echo.
        echo ✓ SQL files verified/created
      displayName: Verify or Create SQL Files
      continueOnError: true

    - script: |
        @echo off
        setlocal enabledelayedexpansion
        
        echo ==========================================
        echo Preparing SQL Database Package
        echo ==========================================
        
        set SQL_DIR=$(Build.SourcesDirectory)\DAY3\Database
        set BUILD_DIR=!SQL_DIR!\bin\Release
        
        echo SQL_DIR: !SQL_DIR!
        echo BUILD_DIR: !BUILD_DIR!
        
        REM Create output directories
        if not exist "!BUILD_DIR!" (
          echo Creating build directory...
          mkdir "!BUILD_DIR!"
        )
        
        REM List SQL files that will be deployed
        echo.
        echo SQL Files to be deployed:
        dir /s "!SQL_DIR!\*.sql" 2>nul
        
        echo.
        echo ✓ Package preparation complete
      displayName: Prepare SQL Database Package

    - task: PublishBuildArtifacts@1
      displayName: Publish DACPAC artifact
      inputs:
        pathToPublish: '$(Build.SourcesDirectory)/DAY3/Database'
        artifactName: 'dacpac-build'
        publishLocation: 'Container'

    - task: CopyFiles@2
      displayName: Copy SQL files to staging
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)/DAY3/Database'
        contents: '**/*.sql'
        targetFolder: '$(Build.ArtifactStagingDirectory)/sql-scripts'

    - task: PublishBuildArtifacts@1
      displayName: Publish SQL scripts artifact
      inputs:
        pathToPublish: '$(Build.ArtifactStagingDirectory)/sql-scripts'
        artifactName: 'sql-scripts'
        publishLocation: 'Container'

- stage: DeployDev
  displayName: Deploy to Development SQL Server
  dependsOn: Package
  condition: succeeded()
  jobs:
  - deployment: DeployDacpac
    displayName: Deploy DACPAC to SQL Server
    pool:
      vmImage: windows-2025
    environment: $(ENVIRONMENT_NAME)

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - powershell: |
              $os = Get-CimInstance Win32_OperatingSystem
              Write-Host "Deployment agent OS: $($os.Caption)"
              if ($os.Caption -notmatch 'Windows Server 2025') {
                Write-Error "This deployment requires Windows Server 2025."
              }
            displayName: Verify Windows Server 2025 agent

          - task: DownloadBuildArtifacts@1
            displayName: Download SQL scripts
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'sql-scripts'
              downloadPath: '$(Agent.BuildDirectory)'

          - powershell: |
              $server = '$(DevSqlServer)'.Split(',')[0]
              $port = 1433
              Write-Host "Testing TCP connectivity to $server`:$port from the deployment agent..."
              $result = Test-NetConnection -ComputerName $server -Port $port -InformationLevel Detailed
              if (-not $result.TcpTestSucceeded) {
                Write-Error "TCP port $port is not reachable on $server. Open SQL Server TCP $port, allow the Azure DevOps agent through the firewall, or use a self-hosted agent on the SQL network."
              }
            displayName: Test SQL Server TCP connectivity

          - script: |
              @echo off
              setlocal enabledelayedexpansion
              
              REM Configure SQL Server connection details
              set "SQL_SERVER=$(DevSqlServer)"
              set "SQL_DATABASE=test"
              set "SQL_USERNAME=abhi"
              set "SQL_PASSWORD=%SqlServerPassword%"
              
              echo ==========================================
              echo Attempting to Deploy SQL Scripts to Development
              echo ==========================================
              echo Server: !SQL_SERVER!
              echo Database: !SQL_DATABASE!
              echo.
              echo This step requires network access to the configured SQL Server
              echo.
              
              REM Test connection first
              sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -C -Q "SELECT @@VERSION;" -l 5
              
              if !errorlevel! neq 0 (
                echo.
                echo ⚠ SQL Server not accessible at !SQL_SERVER!
                echo Check TCP port 1433, SQL authentication, the sa password, and firewall rules.
                echo.
                exit /b 1
              )
              
              echo ✓ SQL Server is accessible
              echo.
              
              REM Create database if it doesn't exist
              sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -C -b -Q "IF NOT EXISTS(SELECT 1 FROM sys.databases WHERE name='!SQL_DATABASE!') CREATE DATABASE [!SQL_DATABASE!];" -l 10
              
              if !errorlevel! neq 0 (
                echo Warning: Could not create database, but continuing
              )
              
              REM Deploy Tables
              echo.
              echo Deploying Tables...
              for /r "$(Agent.BuildDirectory)\sql-scripts\dbo\Tables" %%F in (*.sql) do (
                echo Executing: %%~nxF
                sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -d "!SQL_DATABASE!" -C -b -i "%%F" -l 10
                
                if !errorlevel! neq 0 (
                  echo Warning: Error executing %%~nxF (continuing)
                )
              )
              
              REM Deploy Stored Procedures
              echo.
              echo Deploying Stored Procedures...
              for /r "$(Agent.BuildDirectory)\sql-scripts\dbo\StoredProcedures" %%F in (*.sql) do (
                echo Executing: %%~nxF
                sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -d "!SQL_DATABASE!" -C -b -i "%%F" -l 10
                
                if !errorlevel! neq 0 (
                  echo Warning: Error executing %%~nxF (continuing)
                )
              )
              
              echo.
              echo ✓ SQL deployment completed
            displayName: Deploy SQL scripts to Development
            env:
              SqlServerPassword: $(SqlServerPassword)

          - script: |
              @echo off
              setlocal enabledelayedexpansion
              
              set "SQL_SERVER=$(DevSqlServer)"
              set "SQL_DATABASE=test"
              set "SQL_USERNAME=abhi"
              set "SQL_PASSWORD=%SqlServerPassword%"
              
              REM Try to verify deployment, but don't fail if SQL Server is not available
              sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -d "!SQL_DATABASE!" -C -Q "SELECT @@VERSION;" -l 5
              
              if !errorlevel! equ 0 (
                echo ✓ Database connection verified
                echo ✓ Deployment successful
              ) else (
                echo.
                echo Error: SQL Server verification failed for !SQL_SERVER!
                exit /b 1
              )
            displayName: Verify SQL Server deployment
            env:
              SqlServerPassword: $(SqlServerPassword)

- stage: DeployProd
  displayName: Deploy to Production SQL Server
  dependsOn: DeployDev
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: DeployDacpacProd
    displayName: Deploy DACPAC to Production SQL Server
    pool:
      vmImage: windows-2025
    environment: 'Production'

    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - powershell: |
              $os = Get-CimInstance Win32_OperatingSystem
              Write-Host "Deployment agent OS: $($os.Caption)"
              if ($os.Caption -notmatch 'Windows Server 2025') {
                Write-Error "This deployment requires Windows Server 2025."
              }
            displayName: Verify Windows Server 2025 agent

          - task: DownloadBuildArtifacts@1
            displayName: Download SQL scripts
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'sql-scripts'
              downloadPath: '$(Agent.BuildDirectory)'

          - script: |
              @echo off
              setlocal enabledelayedexpansion
              
              REM Configure Production SQL Server connection details
              set "SQL_SERVER=$(ProdSqlServer)"
              set "SQL_DATABASE=$(ProdSqlDatabase)"
              set "SQL_USERNAME=$(ProdSqlUsername)"
              set "SQL_PASSWORD=%SqlServerPassword%"
              
              echo ==========================================
              echo Deploying SQL Scripts to Production
              echo ==========================================
              echo Server: !SQL_SERVER!
              echo Database: !SQL_DATABASE!
              
              REM Verify database exists before deployment
              sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -C -b -Q "SELECT @@VERSION;" -l 5
              
              if !errorlevel! neq 0 (
                echo Error: Cannot connect to production database
                exit /b 1
              )
              
              REM Create database backup before deployment
              echo.
              echo Creating database backup...
              set BACKUP_PATH=C:\SQLBackups\!SQL_DATABASE!_$(Build.BuildId).bak
              sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -C -b -Q "BACKUP DATABASE [!SQL_DATABASE!] TO DISK = N'!BACKUP_PATH!' WITH NOFORMAT, NOINIT, STATS = 10;" -l 10
              
              if !errorlevel! neq 0 (
                echo Warning: Backup failed, continuing with deployment
              ) else (
                echo ✓ Backup created: !BACKUP_PATH!
              )
              
              REM Deploy Tables
              echo.
              echo Deploying Tables...
              for /r "$(Agent.BuildDirectory)\sql-scripts\dbo\Tables" %%F in (*.sql) do (
                echo Executing: %%F
                sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -d "!SQL_DATABASE!" -C -b -i "%%F" -l 10
                
                if !errorlevel! neq 0 (
                  echo Error executing %%F
                  exit /b 1
                )
              )
              
              REM Deploy Stored Procedures
              echo.
              echo Deploying Stored Procedures...
              for /r "$(Agent.BuildDirectory)\sql-scripts\dbo\StoredProcedures" %%F in (*.sql) do (
                echo Executing: %%F
                sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -d "!SQL_DATABASE!" -C -b -i "%%F" -l 10
                
                if !errorlevel! neq 0 (
                  echo Error executing %%F
                  exit /b 1
                )
              )
              
              echo.
              echo ✓ Production SQL deployment completed successfully
            displayName: Deploy SQL scripts to Production
            env:
              ProdSqlServer: $(ProdSqlServer)
              ProdSqlDatabase: $(ProdSqlDatabase)
              ProdSqlUsername: $(ProdSqlUsername)
              SqlServerPassword: $(SqlServerPassword)

          - script: |
              @echo off
              setlocal enabledelayedexpansion
              
              REM Verify production deployment
              set "SQL_SERVER=$(ProdSqlServer)"
              set "SQL_DATABASE=$(ProdSqlDatabase)"
              set "SQL_USERNAME=$(ProdSqlUsername)"
              set "SQL_PASSWORD=%SqlServerPassword%"
              
              sqlcmd -S "!SQL_SERVER!" -U "!SQL_USERNAME!" -P "!SQL_PASSWORD!" -d "!SQL_DATABASE!" -C -Q "SELECT @@VERSION;" -l 5
              
              if !errorlevel! equ 0 (
                echo ✓ Production database connection verified
              ) else (
                echo Warning: Could not verify production database connection
              )
            displayName: Verify Production SQL Server deployment
            continueOnError: true
            env:
              ProdSqlServer: $(ProdSqlServer)
              ProdSqlDatabase: $(ProdSqlDatabase)
              ProdSqlUsername: $(ProdSqlUsername)
              SqlServerPassword: $(SqlServerPassword)
